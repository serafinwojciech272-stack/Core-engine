name: Job Agent Hourly Sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: job-agent-live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger live job discovery
        env:
          SYNC_URL: https://job-agent-live.onrender.com/api/jobs/sync
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Job Agent sync attempt $attempt/3"
            if curl --fail-with-body --silent --show-error               --retry 2 --retry-delay 5 --connect-timeout 15 --max-time 120               -H "Origin: https://job-agent-live.onrender.com"               -H "User-Agent: Core-Engine-Job-Agent-Scheduler/1.0"               -X POST               "$SYNC_URL"; then
              echo "Job Agent sync completed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "Job Agent sync failed after 3 attempts."
          exit 1
