name: Job Agent Hourly Sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live job discovery
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Origin: https://job-agent-live.onrender.com" \
            -X POST \
            https://job-agent-live.onrender.com/api/jobs/sync
