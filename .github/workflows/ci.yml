name: core-engine-ci
# production-quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: core-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Optional dependencies are required: pdfjs-dist polyfills DOMMatrix via
        # the optional @napi-rs/canvas package, which PDF ingestion depends on.
        run: npm ci --ignore-scripts --no-audit --no-fund --progress=false --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Official tender document ingestion smoke
        run: node --test --experimental-strip-types scripts/official-tender-smoke.ts
      - run: npm run build
