name: core-engine-ci
# production-quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: core-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Optional dependencies are required: pdfjs-dist polyfills DOMMatrix via
        # the optional @napi-rs/canvas package, which PDF ingestion depends on.
        run: npm ci --ignore-scripts --no-audit --no-fund --progress=false --legacy-peer-deps
      - name: Typecheck diagnostic
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-typecheck-diagnostic
          path: typecheck.log
      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: npm run lint
      - name: Test diagnostic
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee test.log
      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-test-diagnostic
          path: test.log
      - name: Enforce tests
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Official tender document ingestion smoke
        run: node --test --experimental-strip-types scripts/official-tender-smoke.ts
      - run: npm run build
