name: core-engine-ci
# production-quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: core-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund --progress=false --legacy-peer-deps
      - name: Pin lint runtime compatibility
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --progress=false --legacy-peer-deps eslint@9.39.5
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
