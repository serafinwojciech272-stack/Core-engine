name: Core Engine Production E2E Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  production-e2e-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: deterministic
            task: "oblicz 2+2"
            expect_artifact: "none"
          - id: universal-ai
            task: "Napisz jedno krótkie zdanie potwierdzające działanie Core Engine AI."
            expect_artifact: "none"
          - id: website
            task: "stwórz stronę WWW dla restauracji w Krakowie z sekcją menu i kontaktem"
            expect_artifact: "website"
            expect_tool: "multitask.website.build"
          - id: data
            task: "przygotuj wykres KPI dla sprzedaży miesięcznej"
            expect_artifact: "data"
            expect_tool: "multitask.data.analyze"
          - id: document
            task: "utwórz dokument PDF z krótkim raportem o Core Engine AI"
            expect_artifact: "file"
            expect_tool: "multitask.document.create"
          - id: weather
            task: "sprawdź pogodę w Krakowie"
            expect_artifact: "data"
            expect_tool: "multitask.weather.current"

    steps:
      - name: Health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://core-engine-34uu.onrender.com/api/health \
            > /tmp/health.json
          cat /tmp/health.json

      - name: Execute matrix case
        env:
          CASE_ID: ${{ matrix.id }}
          TASK: ${{ matrix.task }}
          EXPECT_ARTIFACT: ${{ matrix.expect_artifact }}
          EXPECT_TOOL: ${{ matrix.expect_tool }}
          CORE_ENGINE_URL: https://core-engine-34uu.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          case_id = os.environ["CASE_ID"]
          task = os.environ["TASK"]
          expected_artifact = os.environ["EXPECT_ARTIFACT"]
          expected_tool = os.environ.get("EXPECT_TOOL", "")
          url = os.environ["CORE_ENGINE_URL"].rstrip("/") + "/api/agent"

          payload = json.dumps({
              "task": task,
              "project": "core-engine-production-matrix"
          }).encode()

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"content-type": "application/json"},
              method="POST"
          )

          started = time.time()
          with urllib.request.urlopen(req, timeout=120) as response:
              data = json.load(response)
          elapsed = round((time.time() - started) * 1000)

          print(json.dumps({
              "case": case_id,
              "elapsedMs": elapsed,
              "requestId": (data.get("performance") or {}).get("requestId"),
              "model": (data.get("intelligence") or {}).get("selectedModels"),
              "artifactType": (data.get("artifact") or {}).get("type"),
              "artifactStatus": (data.get("artifact") or {}).get("status"),
              "verification": data.get("verification"),
              "evidencePersistence": data.get("evidencePersistence"),
              "toolRuns": (data.get("evidence") or {}).get("toolRuns")
          }, ensure_ascii=False, indent=2))

          assert data.get("ok") is True, f"{case_id}: ok=false"
          assert (data.get("performance") or {}).get("requestId"), f"{case_id}: missing requestId"
          assert data.get("verification", {}).get("passed") is True, f"{case_id}: verification failed"
          assert data.get("evidencePersistence", {}).get("persisted") is True, f"{case_id}: evidence persistence failed"

          artifact = data.get("artifact") or {}
          if expected_artifact == "none":
              assert not artifact or artifact.get("status") != "FAILED", f"{case_id}: unexpected failed artifact"
          else:
              assert artifact.get("type") == expected_artifact, f"{case_id}: expected {expected_artifact}, got {artifact}"
              assert artifact.get("status") == "EXECUTED", f"{case_id}: artifact not executed"
              checks = data.get("verification", {}).get("checks", {})
              assert checks.get("executionEvidence") is True, f"{case_id}: missing executionEvidence"
              runs = (data.get("evidence") or {}).get("toolRuns") or []
              assert runs and runs[0].get("status") == "EXECUTED", f"{case_id}: missing executed tool run"
              if expected_tool:
                  assert runs[0].get("tool") == expected_tool, f"{case_id}: expected tool {expected_tool}, got {runs}"

          print(f"CORE_ENGINE_MATRIX_PASS case={case_id} requestId={(data.get('performance') or {}).get('requestId')}")
          PY

  summary:
    if: always()
    needs: production-e2e-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Matrix result
        env:
          RESULTS: ${{ toJSON(needs.production-e2e-matrix.result) }}
        run: |
          echo "CORE_ENGINE_PRODUCTION_E2E_MATRIX_RESULT=$RESULTS"
          test "$RESULTS" = "success"
