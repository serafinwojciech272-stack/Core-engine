name: Core Engine Production E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  production-e2e:
    # Run the full smoke suite on one hosted runner. This avoids matrix-wide
    # runner allocation failures and makes the first failing case observable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Health
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30               https://core-engine-34uu.onrender.com/api/health               > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health attempt $attempt failed; retrying..."
            sleep 5
          done
          exit 1

      - name: Execute production E2E suite
        env:
          CORE_ENGINE_URL: https://core-engine-34uu.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          cases = [
              ("deterministic", "oblicz 2+2", "none", ""),
              ("universal-ai", "Napisz jedno krótkie zdanie potwierdzające działanie Core Engine AI.", "none", ""),
              ("website", "stwórz stronę WWW dla restauracji w Krakowie z sekcją menu i kontaktem", "website", "multitask.website.build"),
              ("data", "przygotuj wykres KPI dla sprzedaży miesięcznej", "data", "multitask.data.analyze"),
              ("document", "utwórz dokument PDF z krótkim raportem o Core Engine AI", "file", "multitask.document.create"),
              ("weather", "sprawdź pogodę w Krakowie", "data", "multitask.weather.current"),
          ]

          base = os.environ["CORE_ENGINE_URL"].rstrip("/")
          url = base + "/api/agent"

          def call(task):
              payload = json.dumps({
                  "task": task,
                  "project": "core-engine-production-e2e"
              }).encode()
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"content-type": "application/json"},
                  method="POST",
              )
              last = None
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(req, timeout=150) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      last = RuntimeError(f"HTTP {exc.code}: {body[:1000]}")
                      if exc.code < 500 and exc.code != 429:
                          raise last
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                  if attempt < 3:
                      time.sleep(5 * attempt)
              raise last

          failures = []
          for case_id, task, expected_artifact, expected_tool in cases:
              started = time.time()
              try:
                  data = call(task)
                  elapsed = round((time.time() - started) * 1000)
                  artifact = data.get("artifact") or {}
                  verification = data.get("verification") or {}
                  persistence = data.get("evidencePersistence") or {}
                  runs = (data.get("evidence") or {}).get("toolRuns") or []

                  print(json.dumps({
                      "case": case_id,
                      "elapsedMs": elapsed,
                      "requestId": (data.get("performance") or {}).get("requestId"),
                      "artifactType": artifact.get("type"),
                      "artifactStatus": artifact.get("status"),
                      "verification": verification,
                      "evidencePersistence": persistence,
                      "toolRuns": runs,
                  }, ensure_ascii=False, indent=2))

                  assert data.get("ok") is True, "ok=false"
                  assert (data.get("performance") or {}).get("requestId"), "missing requestId"
                  assert verification.get("passed") is True, "verification failed"
                  assert persistence.get("persisted") is True, "evidence persistence failed"

                  if expected_artifact == "none":
                      assert not artifact or artifact.get("status") != "FAILED", "unexpected failed artifact"
                  else:
                      assert artifact.get("type") == expected_artifact, f"expected artifact {expected_artifact}"
                      assert artifact.get("status") == "EXECUTED", "artifact not executed"
                      assert (verification.get("checks") or {}).get("executionEvidence") is True, "missing executionEvidence"
                      assert runs and runs[0].get("status") == "EXECUTED", "missing executed tool run"
                      assert runs[0].get("tool") == expected_tool, f"expected tool {expected_tool}, got {runs}"
              except Exception as exc:
                  failures.append(f"{case_id}: {exc}")
                  print(f"CORE_ENGINE_E2E_FAIL case={case_id} error={exc}")
                  break
              else:
                  print(f"CORE_ENGINE_E2E_PASS case={case_id}")

          if failures:
              raise SystemExit("\n".join(failures))

          print("CORE_ENGINE_PRODUCTION_E2E_PASS")
          PY
